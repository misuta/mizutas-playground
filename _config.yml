title: "Mizuta’s Playground"
description: "A space for exploring Bitcoin, sovereignty, and the economics of trust-minimization."
url: "https://playground.mizuta.eu"
baseurl: "" # custom domain at the root; stops github-metadata from guessing /pages/... locally

author: "Yukio Mizuta"
github_username: "misuta"
twitter_username: "mizutabushi"
email: "yukio.mizuta@protonmail.com"
lightning_address: "mizuta@getalby.com"

# Google Analytics 4 (property "Mizuta's Playground")
# Loaded only after cookie consent (_includes/cookie-consent.html)
google_analytics: "G-SY2E6QPP51"

# Pages shown in the top navigation (keeps Privacy out of the nav)
header_pages:
  - about.markdown




# Theme
theme: minima

# SEO plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-paginate
  - jekyll-redirect-from

# Permalinks (clean, SEO-friendly)
permalink: /:year/:month/:day/:title/

# Pagination
paginate: 5
paginate_path: "/page/:num/"

# Markdown + high-quality formatting
markdown: kramdown
kramdown:
  input: GFM

# Default metadata for all posts
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      lang: "en"
      twitter_card: "summary_large_image"

# Exclude unnecessary files from sitemap
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - README.md
  - LICENSE
  - vendor
  - scripts
