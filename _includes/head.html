<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {%- seo -%}
  {%- feed_meta -%}

  <!-- Fonts (Noto Serif JP + Inter) are self-hosted: see @font-face in assets/main.scss -->

  <!-- ?v= changes on every build so browsers don't reuse a stale cached CSS -->
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon/favicon-32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicon/favicon-16.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/favicon/apple-touch-icon.png' | relative_url }}">
  <link rel="manifest" href="{{ '/assets/images/favicon/site.webmanifest' | relative_url }}">
  <meta name="theme-color" content="#FAFAF2">
  <!-- Google Analytics is loaded only after consent: see _includes/cookie-consent.html -->
</head>
